<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
<defs>
  <style>
    .el{font:700 30px Arial,Helvetica,sans-serif;fill:#2a2418;text-anchor:middle;dominant-baseline:central}
    .lab{font:600 17px Arial,Helvetica,sans-serif;fill:#5a5140;text-anchor:middle}
    .cap{font:700 20px Arial,Helvetica,sans-serif;fill:#2d7d6e;text-anchor:middle}
    .e-l{animation:el 3s ease-in-out infinite}
    .e-r{animation:er 3s ease-in-out infinite}
    @keyframes el{0%,18%{transform:translateX(0)}62%,100%{transform:translateX(236px)}}
    @keyframes er{0%,18%{transform:translateX(0)}62%,100%{transform:translateX(-236px)}}
    .pulse{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pu{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:.9;transform:scale(1.1)}}
    .dash{stroke-dasharray:8 8;animation:fl 2s linear infinite}
    @keyframes fl{to{stroke-dashoffset:-32}}
  </style>
</defs>
<rect width="1200" height="560" rx="18" fill="#f6f3ea"/>
<path d="M520 280 H690" stroke="#d88a3a" stroke-width="5" marker-end="url(#ar)"/>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#d88a3a"/></marker></defs>
<circle cx="220" cy="280" r="78" fill="none" stroke="#2d7d6e" stroke-opacity=".22" stroke-width="2" class="dash"/>
<circle cx="430" cy="280" r="78" fill="none" stroke="#2d7d6e" stroke-opacity=".22" stroke-width="2" class="dash"/>
<circle cx="220" cy="280" r="46" fill="#2d7d6e"/><text x="220" y="281" class="el" style="fill:#fff">H</text>
<circle cx="430" cy="280" r="46" fill="#2d7d6e"/><text x="430" y="281" class="el" style="fill:#fff">H</text>
<circle cx="152" cy="280" r="11" fill="#d88a3a" class="e-l"/>
<circle cx="500" cy="280" r="11" fill="#d88a3a" class="e-r"/>
<text x="325" y="415" class="lab">2 nguyên tử H · mỗi nguyên tử có 1 electron lớp ngoài cùng</text>
<text x="325" y="448" class="cap">1s¹  +  1s¹</text>
<ellipse cx="880" cy="280" rx="118" ry="74" fill="#4ea893" opacity=".18" class="pulse"/>
<circle cx="830" cy="280" r="52" fill="#2d7d6e"/><text x="830" y="281" class="el" style="fill:#fff">H</text>
<circle cx="930" cy="280" r="52" fill="#2d7d6e"/><text x="930" y="281" class="el" style="fill:#fff">H</text>
<circle cx="869" cy="280" r="10" fill="#d88a3a"/><circle cx="891" cy="280" r="10" fill="#d88a3a"/>
<path d="M830 280 H930" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
<text x="880" y="415" class="lab">cặp electron dùng chung nằm giữa 2 hạt nhân</text>
<text x="880" y="448" class="cap">H:H  →  H–H</text>
<text x="600" y="520" class="lab" style="font-size:19px;fill:#2a2418;font-weight:700">Mỗi nguyên tử đạt cấu hình bền của He: 2 electron lớp ngoài cùng</text>
</svg>
