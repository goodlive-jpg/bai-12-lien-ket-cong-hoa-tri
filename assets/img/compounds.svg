<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560">
<defs>
  <style>
    .ti{font:800 26px Arial,Helvetica,sans-serif;fill:#2d7d6e;text-anchor:middle}
    .sym{font:800 34px Arial,Helvetica,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}
    .symh{font:800 34px Arial,Helvetica,sans-serif;fill:#2d7d6e;text-anchor:middle;dominant-baseline:central}
    .note{font:600 16px Arial,Helvetica,sans-serif;fill:#5a5140;text-anchor:middle}
    .ln{stroke:#2a2418;stroke-width:7;stroke-linecap:round}
    .dot{fill:#2a2418}
  </style>
</defs>
<rect width="1400" height="560" rx="18" fill="#f6f3ea"/>
<g stroke="#d9d2c1" stroke-width="2"><path d="M700 40V520M0 280H1400"/></g>
<g>
  <text x="350" y="62" class="ti">HCl · phân cực</text>
  <circle cx="270" cy="165" r="42" fill="#fff" stroke="#2d7d6e" stroke-width="4"/><text x="270" y="166" class="symh">H</text>
  <circle cx="430" cy="165" r="52" fill="#4ea893"/><text x="430" y="166" class="sym">Cl</text>
  <path d="M312 165H378" class="ln"/>
  <g class="dot"><circle cx="412" cy="122" r="6"/><circle cx="440" cy="122" r="6"/><circle cx="412" cy="208" r="6"/><circle cx="440" cy="208" r="6"/><circle cx="452" cy="165" r="6"/></g>
  <text x="350" y="250" class="note">cặp electron lệch về Cl (độ âm điện lớn hơn)</text>
</g>
<g>
  <text x="1050" y="62" class="ti">H₂O · 2 liên kết</text>
  <circle cx="1050" cy="155" r="52" fill="#c4593f"/><text x="1050" y="156" class="sym">O</text>
  <circle cx="960" cy="230" r="40" fill="#fff" stroke="#2d7d6e" stroke-width="4"/><text x="960" y="231" class="symh">H</text>
  <circle cx="1140" cy="230" r="40" fill="#fff" stroke="#2d7d6e" stroke-width="4"/><text x="1140" y="231" class="symh">H</text>
  <path d="M1020 190 L985 205M1080 190 L1115 205" class="ln"/>
  <g class="dot"><circle cx="1027" cy="128" r="6"/><circle cx="1073" cy="128" r="6"/></g>
  <text x="1050" y="250" class="note">O còn 2 cặp electron chưa liên kết</text>
</g>
<g>
  <text x="350" y="342" class="ti">NH₃ · 3 liên kết</text>
  <circle cx="350" cy="425" r="52" fill="#d88a3a"/><text x="350" y="426" class="sym">N</text>
  <circle cx="245" cy="470" r="38" fill="#fff" stroke="#2d7d6e" stroke-width="4"/><text x="245" y="471" class="symh">H</text>
  <circle cx="350" cy="500" r="38" fill="#fff" stroke="#2d7d6e" stroke-width="4"/><text x="350" y="501" class="symh">H</text>
  <circle cx="455" cy="470" r="38" fill="#fff" stroke="#2d7d6e" stroke-width="4"/><text x="455" y="471" class="symh">H</text>
  <path d="M310 450 L275 466M350 477V482M390 450 L425 466" class="ln"/>
  <circle cx="350" cy="385" r="6" class="dot"/><circle cx="368" cy="385" r="6" class="dot"/>
  <text x="350" y="540" class="note">N có 1 cặp electron đơn độc</text>
</g>
<g>
  <text x="1050" y="342" class="ti">CH₄ · 4 liên kết</text>
  <circle cx="1050" cy="425" r="52" fill="#2d7d6e"/><text x="1050" y="426" class="sym">C</text>
  <circle cx="950" cy="425" r="38" fill="#fff" stroke="#2d7d6e" stroke-width="4"/><text x="950" y="426" class="symh">H</text>
  <circle cx="1150" cy="425" r="38" fill="#fff" stroke="#2d7d6e" stroke-width="4"/><text x="1150" y="426" class="symh">H</text>
  <circle cx="1050" cy="335" r="38" fill="#fff" stroke="#2d7d6e" stroke-width="4"/><text x="1050" y="336" class="symh">H</text>
  <circle cx="1050" cy="515" r="38" fill="#fff" stroke="#2d7d6e" stroke-width="4"/><text x="1050" y="516" class="symh">H</text>
  <path d="M998 425H1010M1090 425H1102M1050 373V385M1050 465V477" class="ln"/>
  <text x="1050" y="540" class="note">C ở giữa tạo 4 liên kết đơn</text>
</g>
</svg>
