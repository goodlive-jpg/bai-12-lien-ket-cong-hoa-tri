<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 500" width="1400" height="500">
<defs>
  <style>
    .ti{font:800 26px Arial,Helvetica,sans-serif;fill:#2d7d6e;text-anchor:middle}
    .lb{font:600 19px Arial,Helvetica,sans-serif;fill:#5a5140;text-anchor:middle}
    .sg{font:800 42px Arial,Helvetica,sans-serif;fill:#2a2418;text-anchor:middle}
    .ax{stroke:#8a7f68;stroke-width:2;stroke-dasharray:9 8}
    .orb{fill:#4ea893;fill-opacity:.28;stroke:#2d7d6e;stroke-width:3}
    .ov{fill:#d88a3a;fill-opacity:.55;animation:pl 2.6s ease-in-out infinite}
    @keyframes pl{0%,100%{opacity:.45}50%{opacity:1}}
  </style>
</defs>
<rect width="1400" height="500" rx="18" fill="#f6f3ea"/>
<g stroke="#d9d2c1" stroke-width="2"><path d="M466 44V456M932 44V456"/></g>
<g>
  <text x="233" y="64" class="ti">s – s</text>
  <path d="M60 260 H410" class="ax"/>
  <circle cx="170" cy="260" r="68" class="orb"/><circle cx="290" cy="260" r="68" class="orb"/>
  <path d="M222 260 Q230 218 238 260 Q230 302 222 260Z" class="ov"/>
  <circle cx="170" cy="260" r="7" fill="#2a2418"/><circle cx="290" cy="260" r="7" fill="#2a2418"/>
  <text x="233" y="365" class="lb">H₂ : 1s + 1s</text>
  <text x="233" y="420" class="sg">σ</text>
</g>
<g>
  <text x="700" y="64" class="ti">s – p</text>
  <path d="M520 260 H880" class="ax"/>
  <circle cx="610" cy="260" r="62" class="orb"/>
  <ellipse cx="760" cy="205" rx="46" ry="58" class="orb"/><ellipse cx="760" cy="315" rx="46" ry="58" class="orb"/>
  <path d="M662 230 Q700 260 662 290 Q640 260 662 230Z" class="ov"/>
  <circle cx="610" cy="260" r="7" fill="#2a2418"/><circle cx="760" cy="260" r="7" fill="#2a2418"/>
  <text x="700" y="365" class="lb">HCl : 1s + 3p</text>
  <text x="700" y="420" class="sg">σ</text>
</g>
<g>
  <text x="1167" y="64" class="ti">p – p (đầu–đầu)</text>
  <path d="M990 260 H1350" class="ax"/>
  <ellipse cx="1090" cy="205" rx="45" ry="58" class="orb"/><ellipse cx="1090" cy="315" rx="45" ry="58" class="orb"/>
  <ellipse cx="1250" cy="205" rx="45" ry="58" class="orb"/><ellipse cx="1250" cy="315" rx="45" ry="58" class="orb"/>
  <path d="M1135 220 Q1170 260 1135 300 Q1160 260 1135 220Z" class="ov"/>
  <circle cx="1090" cy="260" r="7" fill="#2a2418"/><circle cx="1250" cy="260" r="7" fill="#2a2418"/>
  <text x="1167" y="365" class="lb">Cl₂ : 3p + 3p</text>
  <text x="1167" y="420" class="sg">σ</text>
</g>
<text x="700" y="478" class="lb" style="font-size:17px;fill:#2a2418;font-weight:700">Xen phủ dọc trục liên kết → liên kết σ · đối xứng quanh trục · bền nhất</text>
</svg>
