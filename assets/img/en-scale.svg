<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 440" width="1400" height="440">
<defs>
  <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#4ea893"/><stop offset=".5" stop-color="#d88a3a"/><stop offset="1" stop-color="#c4593f"/></linearGradient>
  <style>
    .z{font:700 20px Arial,Helvetica,sans-serif;fill:#fff;text-anchor:middle}
    .el{font:700 18px Arial,Helvetica,sans-serif;fill:#2a2418;text-anchor:middle}
    .val{font:600 15px Arial,Helvetica,sans-serif;fill:#5a5140;text-anchor:middle}
    .hd{font:800 22px Arial,Helvetica,sans-serif;fill:#2d7d6e;text-anchor:middle}
    .pin{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pu{0%,100%{r:8;opacity:.6}50%{r:12;opacity:1}}
  </style>
</defs>
<rect width="1400" height="440" rx="18" fill="#fbfaf6"/>
<text x="700" y="52" class="hd">ĐỘ ÂM ĐIỆN χ · khả năng hút electron của nguyên tử</text>
<rect x="80" y="110" width="510" height="70" rx="10" fill="#4ea893"/>
<rect x="590" y="110" width="530" height="70" fill="#d88a3a"/>
<rect x="1120" y="110" width="200" height="70" rx="10" fill="#c4593f"/>
<rect x="80" y="110" width="1240" height="70" rx="10" fill="none" stroke="#fff" stroke-width="3"/>
<text x="335" y="154" class="z">KHÔNG PHÂN CỰC · Δχ &lt; 0,4</text>
<text x="855" y="154" class="z">PHÂN CỰC · 0,4 ≤ Δχ &lt; 1,7</text>
<text x="1220" y="154" class="z">ION · Δχ ≥ 1,7</text>
<g>
  <path d="M150 180V205M340 180V205M520 180V205M700 180V205M870 180V205M1180 180V205" stroke="#8a7f68" stroke-width="2"/>
  <text x="150" y="232" class="el">Na 0,93</text><text x="340" y="232" class="el">H 2,20</text><text x="520" y="232" class="el">C 2,55</text><text x="700" y="232" class="el">Cl 3,16</text><text x="870" y="232" class="el">O 3,44</text><text x="1180" y="232" class="el">F 3,98</text>
</g>
<g fill="#2d7d6e" stroke="#fff" stroke-width="3">
  <circle cx="150" cy="145" r="9" class="pin"/><circle cx="340" cy="145" r="9" class="pin"/><circle cx="520" cy="145" r="9" class="pin"/><circle cx="700" cy="145" r="9" class="pin"/><circle cx="870" cy="145" r="9" class="pin"/><circle cx="1180" cy="145" r="9" class="pin"/>
</g>
<g>
  <rect x="80" y="290" width="380" height="98" rx="12" fill="#eef6f2" stroke="#4ea893" stroke-width="2"/>
  <text x="270" y="326" class="el" style="font-size:20px;fill:#2d7d6e">H₂ · Cl₂ · O₂ · CH₄</text>
  <text x="270" y="360" class="val">chia sẻ electron gần như đều</text>
  <rect x="510" y="290" width="470" height="98" rx="12" fill="#fdf4e9" stroke="#d88a3a" stroke-width="2"/>
  <text x="745" y="326" class="el" style="font-size:20px;fill:#b5671f">HCl · H₂O · NH₃ · CO₂</text>
  <text x="745" y="360" class="val">cặp electron lệch về nguyên tử âm điện hơn</text>
  <rect x="1030" y="290" width="290" height="98" rx="12" fill="#fbeeeb" stroke="#c4593f" stroke-width="2"/>
  <text x="1175" y="326" class="el" style="font-size:20px;fill:#a4442f">NaCl · MgO · CaO</text>
  <text x="1175" y="360" class="val">chuyển electron hoàn toàn</text>
</g>
<text x="700" y="420" class="val" style="font-size:17px;fill:#2a2418;font-weight:700">Δχ = |χ_A − χ_B| · càng lớn → liên kết càng phân cực</text>
</svg>
